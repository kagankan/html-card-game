name: Claude Code Review command test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /review-in-worktree ${{ github.event.pull_request.number }}
            レビュー結果を元に、以下の JSON 形式で review-payload.json をカレントディレクトリに Write してください。
            インラインコメントを個別に投稿しないでください。

            ```json
            {
              "body": "レビュー全体のサマリー（総評セクションの内容）",
              "event": "COMMENT",
              "comments": [
                {
                  "path": "src/example.ts",
                  "line": 42,
                  "side": "RIGHT",
                  "body": "🔴 Critical: 指摘内容\n\n```suggestion\n修正案のコード\n```"
                }
              ]
            }
            ```

            ルール:
            - `body` には総評を記載する
            - `comments` 配列に全指摘（Critical, Warning, Suggestion）をまとめる
            - 各コメントの `body` には severity 絵文字プレフィックスを付ける
            - 修正案がある場合は suggestion コードブロックで記載する
            - `⚪ 検証の結果問題なし` の項目は comments に含めない（body のサマリーに含めてよい）
            - 指摘がない場合は `comments` を空配列にする          
          claude_args: |
            --allowedTools "Write"
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      - name: Submit review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f review-payload.json ]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
              --method POST \
              --input review-payload.json
          else
            echo "::warning::review-payload.json not found, skipping review submission"
          fi
